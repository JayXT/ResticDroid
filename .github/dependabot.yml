# Gradle dependencies and Actions only. The versions that matter most - Go, the
# NDK, restic itself - are pinned in .go-version, .ndk-version and the
# submodule, and are bumped deliberately, because changing any of them
# changes the output bytes and breaks reproducibility with F-Droid.
version: 2
updates:
  # Grouped: one pull request per ecosystem per month, not one per dependency.
  # This repository is maintained in bursts, and eight separate branches to
  # review is how a batch of updates ends up not being reviewed at all.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
