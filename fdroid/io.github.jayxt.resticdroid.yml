Builds:
  - versionName: 0.2.1
    versionCode: 2011
    commit: v0.2.1
    subdir: app
    submodules: true
    sudo:
      - install -d /opt/go
      - curl -sSLo /tmp/go.tar.gz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
      - GO_SHA=ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca
      - echo "$GO_SHA  /tmp/go.tar.gz" | sha256sum -c -
      - tar -C /opt/go --strip-components=1 -xzf /tmp/go.tar.gz
      - rm -f /tmp/go.tar.gz
      - ln -sf /opt/go/bin/go /usr/local/bin/go
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/JayXT/ResticDroid/releases/download/v%v/ResticDroid-v%v-armeabi-v7a.apk
    prebuild:
      - export PATH=/opt/go/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - ../tools/build-restic.sh
    scanignore:
      - restic-android/src/main/jniLibs
      - third_party/restic
    ndk: 27.2.12479018

