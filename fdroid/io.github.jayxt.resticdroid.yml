# One upstream release produces three APKs. VercodeOperation is what makes that
# work with automatic updates: F-Droid detects the new tag, reads the base
# versionCode out of app/build.gradle.kts, and generates one build block per
# expression below. Each expression is the offset that app/build.gradle.kts
# adds for that ABI, in the order the APKs are listed above.
VercodeOperation:
  - "%c * 10 + 1"   # armeabi-v7a
  - "%c * 10 + 2"   # arm64-v8a
  - "%c * 10 + 4"   # x86_64

# Release tags are vX.Y.Z. The anchors keep release candidates and any other
# tag shape out.
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckName: Ignore
AutoUpdateMode: Version v%v

CurrentVersion: 0.2.0
