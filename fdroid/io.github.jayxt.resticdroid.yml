Builds:
  - versionName: 0.2.1
    versionCode: 2011
    commit: d474a5e5a554c71dafa888361f0dff610b2f8455
    subdir: app
    submodules: true
    sudo:
      - echo 'deb https://deb.debian.org/debian forky main' > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky golang-1.26-go=1.26.7-1
      - rm -f /etc/apt/sources.list.d/forky.list
      - apt-get update
      - ln -sf /usr/lib/go-1.26/bin/go /usr/local/bin/go
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/JayXT/ResticDroid/releases/download/v%v/ResticDroid-v%v-armeabi-v7a.apk
    prebuild:
      - export ANDROID_NDK_HOME=$$NDK$$
      - ../tools/build-restic.sh
    scanignore:
      - restic-android/src/main/jniLibs
      - third_party/restic
    ndk: 27.2.12479018

