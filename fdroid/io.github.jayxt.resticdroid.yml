Description: |-
  ResticDroid backs your phone up with restic, the open-source backup program,
  to storage you control: Backblaze B2, S3-compatible object storage, a REST
  server, or a folder on an SD card. Everything is encrypted and
  deduplicated on the device before it is sent, so the storage provider only
  ever holds ciphertext.

  The restic binary is compiled from source as part of this build, from the
  pinned upstream commit in third_party/restic, and runs as a child process.
  Snapshots it writes are ordinary restic snapshots: you can open them with
  restic on a desktop, and nothing about them depends on this app.

  * Backup profiles: what to back up, where to send it, and when.
  * Conditions for scheduled runs: only while charging, only on an unmetered
  network, only on named Wi-Fi networks, only above a battery level.
  * Repositories on Backblaze B2, S3, Azure, Google Cloud Storage, Swift,
  a REST server, or a local folder.
  * Fingerprint, or the repository password, before backups and restores that
  you start yourself. Scheduled runs are never prompted.
  * Local repositories are excluded from every backup automatically, so a
  backup can never copy itself.
  * The configuration is plain text under /storage/emulated/0/ResticDroid,
  one file per profile. Edit it in any text editor and the app follows
  along. There is nothing to import or export.

  Passwords and API keys are held in the Android keystore, hardware-backed
  where the device supports it, and never appear in the configuration files.

  No analytics, no crash reporting, no advertising identifiers, and no
  dependency on Google Play services. The app connects to nothing except the
  repositories you configure.

RepoType: git
Repo: https://github.com/JayXT/ResticDroid.git

Builds:
  - versionName: 0.2.0
    versionCode: 2001
    commit: v0.2.0
    subdir: app
    submodules: true
    sudo:
      - install -d /opt/go
      - curl -sSLo /tmp/go.tar.gz https://go.dev/dl/go1.26.7.linux-amd64.tar.gz
      - GO_SHA=ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca
      - echo "$GO_SHA  /tmp/go.tar.gz" | sha256sum -c -
      - tar -C /opt/go --strip-components=1 -xzf /tmp/go.tar.gz
      - rm -f /tmp/go.tar.gz
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    prebuild:
      - export PATH=/opt/go/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - export RESTIC_ABIS="armeabi-v7a"
      - ../tools/build-restic.sh
    scanignore:
      - restic-android/src/main/jniLibs
      - third_party/restic
    ndk: 27.2.12479018

