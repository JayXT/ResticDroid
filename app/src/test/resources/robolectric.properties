# Robolectric ships an emulated framework per API level and only supports levels
# that have been released long enough for one to exist. Pinning it here keeps
# the app's own targetSdk free to move ahead of Robolectric without every
# JVM test failing with "targetSdkVersion > maxSdkVersion".
#
# Raise this as Robolectric adds levels. None of these tests depend on
# behaviour that changed after API 36.
sdk=36

# Use a plain Application rather than ResticDroidApp.
#
# ResticDroidApp.onCreate starts the configuration file watcher, and Robolectric
# builds a fresh Application per test class. Each one opens inotify instances
# that nothing tears down, so the suite exhausted fs.inotify.max_user_instances
# (128 by default on many systems, including CI runners) and failed with
# "User limit of inotify instances reached" - a failure that has nothing to do
# with the code under test.
#
# Unit tests here exercise components directly; none of them wants the whole
# application graph booted underneath.
application=android.app.Application
