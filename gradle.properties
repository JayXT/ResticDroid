org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Change this one line to publish under your own namespace before submitting
# to F-Droid.  It is threaded through the manifest, the config directory name
# and the CI metadata.
# ---------------------------------------------------------------------------
resticdroid.applicationId=io.github.jayxt.resticdroid

# Pinned restic release that tools/build-restic.sh compiles.  Bump together
# with the submodule in third_party/restic.
resticdroid.resticVersion=0.19.1

kotlin.code.style=official
